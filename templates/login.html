{% extends 'base.html' %}{% block title %}Login · SpendWise{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="auth-brand mb-4"><span class="logo-mark">₹</span><span>SpendWise</span></div><div class="text-center mb-4"><h2 class="mb-2">Welcome back</h2><p class="text-muted mb-0">Sign in to continue to your financial dashboard.</p></div><form method="post"><label>Email address</label><div class="input-group mb-3"><span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span><input class="form-control border-start-0" type="email" name="email" placeholder="you@example.com" required autocomplete="email"></div><label>Password</label><div class="input-group mb-4"><span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span><input class="form-control border-start-0" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></div><button class="btn btn-brand w-100 py-2">Login</button></form><p class="text-center text-muted mt-4 mb-0">Don’t have an account? <a class="fw-bold" href="{{ url_for('register') }}">Register</a></p></div></div>{% endblock %}
