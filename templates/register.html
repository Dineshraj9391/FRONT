{% extends 'base.html' %}{% block title %}Create account · SpendWise{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="auth-brand mb-4"><span class="logo-mark">₹</span><span>SpendWise</span></div><div class="text-center mb-4"><h2 class="mb-2">Create your account</h2><p class="text-muted mb-0">Start your journey toward smarter money habits.</p></div><form method="post"><label>Full name</label><input class="form-control mb-3" name="name" placeholder="Your name" required autocomplete="name"><label>Email address</label><input class="form-control mb-3" type="email" name="email" placeholder="you@example.com" required autocomplete="email"><label>Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" placeholder="At least 6 characters" required autocomplete="new-password"><label>Account type</label><select class="form-select mb-4" name="mode"><option value="student">Student</option><option value="family">Family</option></select><button class="btn btn-brand w-100 py-2">Create account</button></form><p class="text-center text-muted mt-4 mb-0">Already have an account? <a class="fw-bold" href="{{ url_for('login') }}">Login</a></p></div></div>{% endblock %}
