{% extends 'base.html' %}{% block title %}Add expense · SpendWise{% endblock %}{% block content %}<div class="container py-5"><div class="form-shell"><a href="{{ url_for('expenses') }}" class="text-decoration-none">← Back to expenses</a><h2 class="mt-3">Add expense</h2><p class="text-muted">Keep your spending history accurate and useful.</p><form method="post" class="row g-3 mt-2"><div class="col-md-6"><label>Amount (₹)</label><input class="form-control" type="number" step="0.01" min="0.01" name="amount" required></div><div class="col-md-6"><label>Date</label><input class="form-control" type="date" name="spent_on" value="{{ today.isoformat() }}" required></div><div class="col-md-6"><label>Category</label><select class="form-select" name="category_id" required>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Type</label><select class="form-select" name="need_want"><option value="need">Need</option><option value="want">Want</option></select></div><div class="col-12"><label>Note</label><input class="form-control" name="note" maxlength="255" placeholder="e.g. Lunch, bus pass, books"></div><div class="col-12"><button class="btn btn-dark px-4">Save expense</button></div></form></div></div>{% endblock %}
